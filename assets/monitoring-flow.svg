<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Illustrative Wazuh monitoring data flow</title><desc id="desc">Endpoint agents and security tools send events to collection and Wazuh analysis, then indexed alerts reach dashboards and notifications. Topology and transport are scoped per deployment.</desc><rect width="900" height="390" rx="16" fill="#f2f5f9"/><g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="30" y="50" width="190" height="100" rx="8"/><rect x="30" y="230" width="190" height="100" rx="8"/><rect x="295" y="135" width="230" height="120" rx="8"/><rect x="600" y="135" width="120" height="120" rx="8"/><rect x="775" y="70" width="100" height="95" rx="8"/><rect x="775" y="225" width="100" height="95" rx="8"/></g><g fill="none" stroke="#3585f9" stroke-width="3"><path d="M220 100h35v95h40M220 280h35v-85M525 195h75M720 195h25v-80h30M745 195v75h30"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#172a44"><text x="125" y="94" font-size="18" font-weight="700">Endpoint agents</text><text x="125" y="122" font-size="14">OS and audit telemetry</text><text x="125" y="273" font-size="18" font-weight="700">Security tools</text><text x="125" y="301" font-size="14">Syslog / API collectors</text><text x="410" y="180" font-size="18" font-weight="700">Wazuh analysis</text><text x="410" y="210" font-size="14">Decoders · Rules · Alerts</text><text x="660" y="190" font-size="17" font-weight="700">Indexer</text><text x="660" y="218" font-size="13">Search &amp; storage</text><text x="825" y="114" font-size="14" font-weight="700">Dashboard</text><text x="825" y="265" font-size="13" font-weight="700">Notifications</text><text x="450" y="370" font-size="13" fill="#56657a">Conceptual example. Integration paths and cluster topology depend on the selected version and design.</text></g></svg>